# travel-agent-ai/nginx/nginx.conf

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name localhost;

        # Directorio raíz donde se encuentran los archivos de la aplicación
        root /usr/share/nginx/html;

        # Bloque principal para manejar las peticiones
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Configuración para las peticiones a la API del backend
        # Reemplaza 'http://backend:8000' con la URL de tu backend en Docker
        location /api/ {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}